name: PlaneTracker
options:
  bundleIdPrefix: com.planetracker
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  PlaneTracker:
    type: application
    platform: macOS
    sources:
      - PlaneTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.planetracker.PlaneTracker
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Plane Spotter"
        CODE_SIGN_ENTITLEMENTS: PlaneTracker/PlaneTracker.entitlements
    dependencies:
      - target: PlaneTrackerWidgetExtension

  PlaneTrackerWidgetExtension:
    type: app-extension
    platform: macOS
    product: PlaneTrackerWidgetExtension.appex
    sources:
      - PlaneTrackerWidget
    info:
      path: PlaneTrackerWidget/Info.plist
      properties:
        CFBundleDisplayName: PlaneTrackerWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.planetracker.PlaneTracker.widget
        CODE_SIGN_ENTITLEMENTS: PlaneTrackerWidget/PlaneTrackerWidget.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        SKIP_INSTALL: "YES"
